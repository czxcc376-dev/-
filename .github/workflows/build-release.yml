name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dummy google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "clbi-dummy",
              "storage_bucket": "clbi-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.clbi.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUM" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Prepare signing + local.properties
        run: |
          {
            echo "storeFile=keystore/clbi-release.jks"
            echo "storePassword=${CLBI_STORE_PASSWORD}"
            echo "keyAlias=${CLBI_KEY_ALIAS}"
            echo "keyPassword=${CLBI_KEY_PASSWORD}"
          } > local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          ls -la app/keystore/
        env:
          CLBI_STORE_PASSWORD: clbiRelease2026
          CLBI_KEY_ALIAS: clbi
          CLBI_KEY_PASSWORD: clbiRelease2026

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ClBI v1.0.0
          generate_release_notes: true
          files: out/*.apk

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
